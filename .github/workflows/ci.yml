name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run lint

      - name: Run tests
        run: npm run test

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - backend/Backend.Api.csproj
          - microservices/Favoritos.Api/Favoritos.Api.csproj
          - microservices/Generos.Api/Generos.Api.csproj
          - microservices/Libros.Api/Libros.Api.csproj
          - microservices/Login.Api/Login.Api.csproj
          - microservices/Publicaciones.Api/Publicaciones.Api.csproj
          - microservices/Usuarios.Api/Usuarios.Api.csproj
          - microservices/Prestamos.Api/Prestamos.Api.csproj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore project
        run: dotnet restore ${{ matrix.project }}

      - name: Build project
        run: dotnet build ${{ matrix.project }} --configuration Release --no-restore
